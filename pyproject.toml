[project]
name = "provaia"
version = "0.1.0"
description = "Prototipo de geração de provas com googleclassroom API"
authors = [
    {name = "Paulo Cesar Rodacki Gomes",email = "rodacki@gmail.com"}
]
packages = [{ include = "backend/src/provaia" }]  

readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client (>=2.162.0,<3.0.0)",
    "google-auth-httplib2 (>=0.2.0,<0.3.0)",
    "google-auth-oauthlib (>=1.2.1,<2.0.0)",
    "openai (>=1.64.0,<2.0.0)",
    "fpdf (>=1.7.2,<2.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "pydantic[email] (>=2.10.6,<3.0.0)",
    "rich (>=13.9.4,<14.0.0)",
    "uvicorn (>=0.34.0,<0.35.0)",
    "fastapi (>=0.115.11,<0.116.0)",
    "pydantic-settings (>=2.8.1,<3.0.0)",
    "python-dotenv (>=1.0.1,<2.0.0)",
    "requests (>=2.32.3,<3.0.0)",
    "npm (>=0.1.1,<0.2.0)",
    "tailwindcss (>=0.0.1,<0.0.2)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
